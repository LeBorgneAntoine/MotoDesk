[package]
name = "motodesk-desktop"
version = "0.1.0"
description = "Motodesk desktop client"
edition = "2021"
workspace = "../.."
# The Tauri build bundles one binary; the key tool is a separate, command-line one.
default-run = "motodesk-desktop"

[lib]
name = "motodesk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
motodesk-server = { path = "../../crates/motodesk-server" }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# The updater's own tests decode the public key of tauri.conf.json.
base64 = "0.22"
