[package]
name = "motodesk-gpui"
version = "0.1.0"
description = "Motodesk desktop client (native GPUI interface)"
edition = "2024"
build = "build.rs"
# `cargo run -p motodesk-gpui` starts the application; the key tool is asked for by name.
default-run = "motodesk"

# The program an installation holds: `motodesk.exe`.
[[bin]]
name = "motodesk"
path = "src/main.rs"

# The command-line tool that repairs a register whose signing key was lost (docs/KEY-REPAIR.md).
# It is built with the application and is not part of the installer.
[[bin]]
name = "motodesk-keytool"
path = "src/bin/motodesk-keytool.rs"

# The Windows installer, built by cargo-packager (see docs/migration/GPUI.md, « Sur
# l'installateur »): `cargo packager --release -p motodesk-gpui`. Per user, without
# administrator rights. The shop's data is in another folder and is never touched, neither
# by an update nor by an uninstall.
[package.metadata.packager]
product-name = "Motodesk"
identifier = "com.motodesk.app"
publisher = "Motodesk"
description = "Gestion des ateliers et concessions moto et cycle : atelier, stock, caisse et comptabilité fiscale"
category = "Business"
formats = ["nsis"]
binaries = [{ path = "motodesk", main = true }]
icons = ["assets/icon.ico"]
before-packaging-command = "cargo build --release -p motodesk-gpui"

[package.metadata.packager.nsis]
installMode = "currentUser"
installer-icon = "assets/icon.ico"
languages = ["French", "English"]
display-language-selector = false
compression = "lzma"

[dependencies]
motodesk-ui = { path = "../crates/motodesk-ui" }
motodesk-client = { path = "../crates/motodesk-client" }
motodesk-server = { path = "../crates/motodesk-server" }
# The totals of a document on screen are computed as the service seals them.
motodesk-fiscal = { path = "../crates/motodesk-fiscal" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
chrono = { workspace = true }
tracing = "0.1"
anyhow = { workspace = true }
# Settings are stored as JSON values: the settings screen reads and writes them as such.
serde_json = { workspace = true }

# Staying near the clock when the window is closed (see src/background.rs).
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25", default-features = false }
auto-launch = "0.6"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The icon of the program: the one of its window, of its shortcuts and of the task bar.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
# examples/seed.rs fills a throwaway data folder to look at the screens with data in them.
rand = "0.8"
# examples/team_cloud.rs stands in for the cloud's team service.
axum = "0.7"
hex = "0.4"
# examples/release_server.rs stands in for the release server: a manifest, and an installer
# served a piece at a time, signed with a key made on the spot.
minisign = "0.7"
base64 = "0.22"
futures-util = "0.3"
