[package]
name = "motodesk-client"
version = "0.1.0"
edition = "2021"
description = "Typed access to Motodesk's local API and cloud accounts, for the native interface"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
# A large answer (a file of the shared folder) is read a piece at a time.
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
# Reading a CSV file as people export it: Excel saves Windows-1252, and headers carry accents.
encoding_rs = "0.8"
unicode-normalization = "0.1"
# Documents: dates as this PC reads them, pictures decoded for the page, and the PDF itself.
chrono = { workspace = true }
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
resvg = "0.45"

[dev-dependencies]
motodesk-server = { path = "../motodesk-server", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
uuid = { workspace = true }
# A stand-in for the assistant's streamed answer, written piece by piece.
futures-util = "0.3"
