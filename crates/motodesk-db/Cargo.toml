[package]
name = "motodesk-db"
version = "0.1.0"
edition = "2021"
description = "Shared DB helpers for Motodesk sync changelog"

[dependencies]
motodesk-core = { path = "../motodesk-core" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }

[features]
default = []
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
