[package]
name = "motodesk-fiscal"
version = "0.1.0"
edition = "2021"
description = "Inalterable fiscal journal primitives for the French anti-fraud rules (CGI art. 286 I-3 bis)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
rand = "0.8"

[dev-dependencies]
serde_json = { workspace = true }
