name: Release

# Push a tag such as v1.0.0 to build the Windows installer and open a draft
# release. The release stays a draft until someone reads it and publishes it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The version of the application is the one of its package: what it reports as running,
      # what the installer is named after, and what an update is compared with.
      - name: The tag must match the application version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          found=$(grep -m1 '^version' desktop-gpui/Cargo.toml | cut -d'"' -f2)
          if [ "$found" != "$tag" ]; then
            echo "::error file=desktop-gpui/Cargo.toml::version is $found but the tag is $tag"
            exit 1
          fi

      # The cloud address is fixed at build time. An installer built without it
      # points at the machine it runs on and can never sign in online, so refuse to
      # produce one. Set it in the repository's Settings > Secrets and variables >
      # Actions > Variables.
      - name: The cloud address must be set
        shell: bash
        env:
          MOTODESK_CLOUD_URL: ${{ vars.MOTODESK_CLOUD_URL }}
        run: |
          case "$MOTODESK_CLOUD_URL" in
            https://*) echo "Cloud address: $MOTODESK_CLOUD_URL" ;;
            *) echo "::error::Set the repository variable MOTODESK_CLOUD_URL to the server's https address."; exit 1 ;;
          esac

      # Installed copies only accept updates signed with this key (see docs/mises-a-jour.md).
      # Without it the installer could not be updated, so refuse to produce one. The secrets
      # keep the names they were created under.
      - name: The signing key must be set
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the repository secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (docs/mises-a-jour.md)."
            exit 1
          fi

      # The release notes are this version's section of the changelog; the application shows
      # the same text before the update is installed. A version without a section is not built.
      - name: Release notes
        shell: bash
        run: cargo run -p motodesk-release -- notes "${GITHUB_REF_NAME#v}" CHANGELOG.md release-notes.md

      - name: Tests
        run: cargo test --workspace

      # Pinned: the installer's options the application relies on (/P /R /NS) are this version's.
      - name: Packaging tool
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build the installer
        env:
          MOTODESK_CLOUD_URL: ${{ vars.MOTODESK_CLOUD_URL }}
        run: cargo packager --release -p motodesk-gpui

      # Signed the way installed copies verify it, with the version it is for; then the file
      # they read to learn that this version exists.
      - name: Signature, update manifest and checksums
        shell: bash
        env:
          MOTODESK_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MOTODESK_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer=$(ls target/release/*-setup.exe)
          cargo run -p motodesk-release -- sign "$installer" "$version"
          cargo run -p motodesk-release -- manifest "$version" "$installer" "$GITHUB_REPOSITORY" release-notes.md target/release/latest.json
          cd target/release
          sha256sum *-setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A draft is invisible to installed copies: they see `latest.json` only once the release
      # is published, which is the moment someone has read it. A pre-release (v1.2.0-rc.1) is
      # never served as "latest".
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            target/release/*-setup.exe target/release/*-setup.exe.sig \
            target/release/latest.json target/release/SHA256SUMS.txt \
            --draft $flags --verify-tag --title "Motodesk ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
