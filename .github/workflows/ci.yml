name: CI

# A branch is checked once, through its pull request; only master is checked on push.
# (Both triggers on every branch ran each check twice, and the Windows build is slow.)
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The interface (GPUI) needs a windowing stack this job does not install: it is built
      # and tested by the Windows job, the platform it ships on. Everything under it (the
      # data service, the typed client, the release tool) is checked here.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude motodesk-ui --exclude motodesk-gpui
      - name: Tests
        run: cargo test --workspace --exclude motodesk-ui --exclude motodesk-gpui

  # The application ships on Windows: build and test it there, and keep the
  # installer as an artifact so every change proves it still packages.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (interface)
        run: cargo clippy -p motodesk-ui -p motodesk-gpui --all-targets
      - name: Tests
        run: cargo test --workspace
      # The kit's gallery is the only place every component is built together.
      - name: UI kit gallery
        run: cargo build -p motodesk-ui --example gallery
      # Pinned: the installer's options the application relies on (/P /R /NS) are this version's.
      - name: Packaging tool
        run: cargo install cargo-packager --locked --version 0.11.8
      # Checks the installer still packages. It is not signed for updates: the signing key
      # belongs to releases (release.yml) and must never reach the code of a pull request.
      - name: Build the installer
        run: cargo packager --release -p motodesk-gpui
      - uses: actions/upload-artifact@v4
        with:
          name: motodesk-windows-installer
          path: target/release/*-setup.exe
          if-no-files-found: error
          retention-days: 7
