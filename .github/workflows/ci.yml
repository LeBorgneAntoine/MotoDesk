name: CI

# A branch is checked once, through its pull request; only master is checked on push.
# (Both triggers on every branch ran each check twice, and the Windows build is slow.)
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The desktop crate is a Tauri app: the workspace does not build without the
      # system libraries it links against.
      - name: System libraries (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      # The native interface (GPUI) needs a windowing stack this job does not install: it is
      # built and tested by the Windows job, the platform it ships on.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude motodesk-ui --exclude motodesk-gpui
      - name: Tests
        run: cargo test --workspace --exclude motodesk-ui --exclude motodesk-gpui

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint:ui
      - run: npm run check
      - run: npm test

  # The application ships on Windows: build and test it there, and keep the
  # installer as an artifact so every change proves it still packages.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        run: cargo test --workspace
      # The kit's gallery is the only place every component is built together.
      - name: UI kit gallery
        run: cargo build -p motodesk-ui --example gallery
      - name: Frontend dependencies
        working-directory: desktop
        run: npm ci
      # Checks the installer still packages. It is not signed for updates: the signing key
      # belongs to releases (release.yml) and must never reach the code of a pull request.
      - name: Build the installer
        working-directory: desktop
        run: npm run tauri:build:unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: motodesk-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
