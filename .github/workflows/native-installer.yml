name: Native installer

# Builds the Windows installer of the native interface (desktop-gpui) on demand, to try it on a
# test PC. It publishes nothing: the installer stays with the run, as an artifact. The Release
# workflow still builds the Tauri application until the native one replaces it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The cloud address is fixed at build time. An installer built without it points at the
      # machine it runs on and can never sign in online, so refuse to produce one.
      - name: The cloud address must be set
        shell: bash
        env:
          MOTODESK_CLOUD_URL: ${{ vars.MOTODESK_CLOUD_URL }}
        run: |
          case "$MOTODESK_CLOUD_URL" in
            https://*) echo "Cloud address: $MOTODESK_CLOUD_URL" ;;
            *) echo "::error::Set the repository variable MOTODESK_CLOUD_URL to the server's https address."; exit 1 ;;
          esac

      - name: Tests
        run: cargo test -p motodesk-client -p motodesk-ui -p motodesk-gpui -p motodesk-release

      # Pinned: the installer's options the application relies on (/P /R /NS) are this version's.
      - name: Packaging tool
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build the installer
        env:
          MOTODESK_CLOUD_URL: ${{ vars.MOTODESK_CLOUD_URL }}
        run: cargo packager --release -p motodesk-gpui

      # Signed the way installed copies verify it, when the key is there (docs/mises-a-jour.md).
      # Without the key the installer still installs by hand; it cannot be served as an update.
      - name: Sign the installer
        shell: bash
        env:
          MOTODESK_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MOTODESK_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(grep -m1 '^version' desktop-gpui/Cargo.toml | cut -d'"' -f2)
          installer=$(ls target/release/*-setup.exe)
          if [ -n "$MOTODESK_SIGNING_PRIVATE_KEY" ]; then
            cargo run -p motodesk-release -- sign "$installer" "$version"
          else
            echo "::warning::No signing key: the installer is not signed for updates."
          fi
          cd target/release
          sha256sum *-setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: motodesk-native-installer
          path: |
            target/release/*-setup.exe
            target/release/*-setup.exe.sig
            target/release/SHA256SUMS.txt
          if-no-files-found: error
